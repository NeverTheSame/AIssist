name: security

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard-tests-and-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements-redaction.txt
          python -m spacy download en_core_web_lg

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Run redaction benchmark
        run: python benchmarks/run_redaction_benchmark.py

      - name: Enforce benchmark regression thresholds
        run: python benchmarks/check_thresholds.py

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redaction-benchmark
          path: |
            benchmarks/RESULTS.md
            benchmarks/results.json

  promptguard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: cmd/promptguard/go.mod

      - name: go vet
        working-directory: cmd/promptguard
        run: go vet ./...

      - name: go test
        working-directory: cmd/promptguard
        run: go test ./...

      - name: go build
        working-directory: cmd/promptguard
        run: go build -o promptguard .

      - name: Run promptguard against the repo
        working-directory: cmd/promptguard
        run: ./promptguard --root ../.. --format=json | tee ../../promptguard-findings.json

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptguard-findings
          path: promptguard-findings.json
