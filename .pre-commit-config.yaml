repos:
  - repo: local
    hooks:
      - id: pytest-guard
        name: guard/ test suite
        entry: python -m pytest tests/ -q
        language: system
        pass_filenames: false
        types: [python]

      - id: promptguard
        name: promptguard static checks
        entry: bash -c 'cd cmd/promptguard && go run . --root ../..'
        language: system
        pass_filenames: false
        types: [python]
